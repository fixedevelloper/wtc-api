name: Sécurité

on:
  schedule:
    - cron: "0 5 * * 1"      # chaque lundi
  workflow_dispatch:
  pull_request:
    paths: ["pom.xml"]

permissions:
  contents: read
  security-events: write

jobs:
  dependency-check:
    name: Vulnérabilités des dépendances (OWASP)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Nécessite le secret NVD_API_KEY (gratuit, https://nvd.nist.gov/developers/request-an-api-key).
      - name: OWASP Dependency-Check (échec si CVSS >= 7)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          ./mvnw org.owasp:dependency-check-maven:check
          -DnvdApiKey="$NVD_API_KEY" -DfailBuildOnCVSS=7 -DskipTestScope=true

  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
      - run: ./mvnw -DskipTests -Dspotless.check.skip=true -Dspotbugs.skip=true -Djacoco.skip=true package
      - uses: github/codeql-action/analyze@v3
