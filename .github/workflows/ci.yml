name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Un seul déploiement à la fois.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Les noms d'image Docker doivent être en minuscules.
      - name: Nom de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wtc-api" >> "$GITHUB_ENV"

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            # Le jeton passe par l'entrée standard (pas dans la ligne de commande) et la session est fermée ensuite.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd /opt/wtc
            docker compose --env-file .env.prod -f compose.prod.yaml pull api
            # --wait : échoue si l'API ne devient pas « healthy » (la CI passe alors au rouge).
            docker compose --env-file .env.prod -f compose.prod.yaml up -d --wait --wait-timeout 180 api
            docker logout ghcr.io
            docker image prune -f
