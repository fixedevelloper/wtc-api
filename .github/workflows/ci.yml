name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]          # une version publiée (v1.2.3) produit l'image 1.2.3
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, tests et qualité
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # verify = format (Spotless), tests unitaires, tests d'intégration Testcontainers (PostgreSQL réel),
      # invariants du schéma, conformité au contrat, JaCoCo (seuil), SpotBugs + Find Security Bugs.
      - name: Maven verify
        run: ./mvnw verify
      - name: Rapports de tests et de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
            target/spotbugsXml.xml
          retention-days: 14

  contract:
    name: Contrat OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Valider le contrat et ses règles de conception
        run: python tools/check_openapi.py
      - name: Les documents générés sont à jour
        run: |
          python tools/api_docs.py
          git diff --exit-code docs/design/api-overview.md docs/design/frontend-migration.md \
            || { echo "::error::Régénérer avec 'python tools/api_docs.py' et committer"; exit 1; }

  docker:
    name: Image Docker et analyse de vulnérabilités
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wtc-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Analyse Trivy (vulnérabilités corrigeables HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: wtc-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Publication : uniquement sur main et sur les tags, et seulement si build, contrat et scan sont verts.
  # Une pull request construit et analyse l'image (job « docker ») sans jamais la publier.
  publish:
    name: Publier l'image (GHCR)
    needs: [build, contract, docker]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write          # pousser dans ghcr.io avec le GITHUB_TOKEN, sans secret à créer
      id-token: write          # attestation de provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Étiquettes et métadonnées OCI
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Construire et pousser
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Attestation de provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
