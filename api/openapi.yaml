# Source de vérité du contrat d'API. Validé par tools/check_openapi.sh.
openapi: 3.1.0
info:
  title: WTC API
  version: 1.0.0-draft
  summary: API de transfert d'argent WTC (clients, back-office, webhooks Wace).
  description: |-
    Contrat de la refonte (phase 0b), **à valider avec les équipes web et Android avant tout code**.

    - Base unique `/api`, sans numéro de version : évolutions additives uniquement ; en cas de rupture inévitable, en-tête `Api-Version` et période de dépréciation.
    - Identité tirée du jeton : aucune route ne prend un identifiant de client dans l'URL côté client (`/me/...`).
    - Montants : chaînes décimales + devise ; dates ISO-8601 UTC ; erreurs `application/problem+json` (RFC 9457) avec `code` stable.
    - Pagination : `page` (à partir de 0), `size` (≤ 100), `sort=champ,asc|desc` ; réponse `{page,size,totalElements,totalPages,content[]}`.
    - Opérations d'argent : en-tête `Idempotency-Key` obligatoire.
    - `x-origin` : `existing` = remplace une route Symfony (voir `x-replaces`), `new` = ajout de la refonte. `x-pending` = dépend de la spécification Wace.
  license:
    name: Propriétaire
    identifier: LicenseRef-Proprietary
servers:
- url: /api
  description: Base unique des routes
tags:
- name: Authentification
- name: Mon compte
- name: Portefeuille
  description: Portefeuilles par devise, relevés (client et back-office).
- name: Expéditeurs
- name: Bénéficiaires
- name: Transferts
- name: Recharges
- name: Référentiels
- name: Administration
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      operationId: register
      tags:
      - Authentification
      summary: Créer un compte client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      x-origin: existing
      x-replaces:
      - POST /auth/register
  /auth/login:
    post:
      operationId: login
      tags:
      - Authentification
      summary: Se connecter (client ou back-office)
      description: Remplace les trois logins actuels. Si la 2FA est activée (obligatoire pour le personnel), la réponse est un `MfaChallenge`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security: []
      x-origin: existing
      x-replaces:
      - POST /auth/logincustomer
      - POST /auth/signin
      - POST /v2/auth/login
      - POST /auth/v3/login
  /auth/mfa/verify:
    post:
      operationId: verifyMfa
      tags:
      - Authentification
      summary: Valider le second facteur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security: []
      x-origin: new
  /auth/refresh:
    post:
      operationId: refreshToken
      tags:
      - Authentification
      summary: Renouveler les jetons (rotation du refresh token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security: []
      x-origin: existing
      x-replaces:
      - POST /auth/refresh
  /auth/logout:
    post:
      operationId: logout
      tags:
      - Authentification
      summary: Révoquer la famille de refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Aucun contenu.
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-origin: new
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags:
      - Authentification
      summary: Demander une réinitialisation
      description: Répond toujours 204 (pas de fuite d'existence du compte).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Aucun contenu.
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      x-origin: new
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags:
      - Authentification
      summary: Définir un nouveau mot de passe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
      responses:
        '204':
          description: Aucun contenu.
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      x-origin: new
  /me:
    get:
      operationId: getMe
      tags:
      - Mon compte
      summary: Profil de l'utilisateur connecté
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-origin: existing
      x-replaces:
      - GET /v2/profile/{id}
    patch:
      operationId: updateMe
      tags:
      - Mon compte
      summary: Modifier mon profil
      description: Les champs absents restent inchangés. Le changement d'adresse e-mail n'est pas encore pris en charge (`EMAIL_CHANGE_UNSUPPORTED`). Une identité vérifiée (KYC) ne peut plus changer de nom, de date de naissance ni de type (`KYC_LOCKED`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-origin: existing
      x-replaces:
      - POST /v2/profile
  /me/password:
    put:
      operationId: changePassword
      tags:
      - Mon compte
      summary: Changer mon mot de passe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Aucun contenu.
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-origin: existing
      x-replaces:
      - POST /v2/change_password
  /me/photo:
    put:
      operationId: uploadPhoto
      tags:
      - Mon compte
      summary: Définir ma photo de profil
      description: JPEG ou PNG, 2 Mio au plus. Remplace la photo précédente.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
              additionalProperties: false
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-origin: existing
      x-replaces:
      - POST /auth/changephoto
  /me/mfa/enrollment:
    post:
      operationId: startMfaEnrollment
      tags:
      - Mon compte
      summary: Démarrer l'activation de la 2FA (TOTP)
      responses:
        '201':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-origin: new
  /me/mfa/confirmation:
    post:
      operationId: confirmMfaEnrollment
      tags:
      - Mon compte
      summary: Confirmer l'activation de la 2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
      responses:
        '204':
          description: Aucun contenu.
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-origin: new
  /me/mfa:
    delete:
      operationId: disableMfa
      tags:
      - Mon compte
      summary: Désactiver la 2FA (interdit au personnel)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
      responses:
        '204':
          description: Aucun contenu.
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      x-origin: new
  /me/wallet:
    get:
      operationId: getWallet
      tags:
      - Mon compte
      summary: Mon portefeuille
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-origin: new
      parameters:
      - &id001
        $ref: '#/components/parameters/WalletCurrency'
      description: Portefeuille principal (devise du pays de résidence) ou, avec `currency`, le portefeuille de cette devise. Créé à la première lecture.
  /me/wallet/entries:
    get:
      operationId: listWalletEntries
      tags:
      - Mon compte
      summary: Relevé de mon portefeuille
      parameters:
      - *id001
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerEntryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-origin: new
  /me/kyc:
    get:
      operationId: getKyc
      tags:
      - Mon compte
      summary: État de ma vérification d'identité
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-origin: new
  /me/kyc/documents:
    post:
      operationId: uploadKycDocument
      tags:
      - Mon compte
      summary: Déposer un document KYC
      description: JPEG, PNG ou PDF, 5 Mo au plus ; stockage privé.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                documentType:
                  type: string
                side:
                  type: string
                  enum:
                  - FRONT
                  - BACK
                  - SINGLE
                expiresOn:
                  type: string
                  format: date
                file:
                  type: string
                  format: binary
              required:
              - documentType
              - file
              additionalProperties: false
      responses:
        '201':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-origin: existing
      x-replaces:
      - POST /
  /me/kyc/documents/{documentId}:
    get:
      operationId: getKycDocument
      tags:
      - Mon compte
      summary: Un document KYC (avec lien de téléchargement signé)
      parameters:
      - $ref: '#/components/parameters/documentId'
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-origin: new
  /me/senders:
    get:
      operationId: listSenders
      tags:
      - Expéditeurs
      summary: Mes expéditeurs
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-origin: existing
      x-replaces:
      - GET /v2/senders/{id}
      - GET /v2/all_senders/{id}
    post:
      operationId: createSender
      tags:
      - Expéditeurs
      summary: Créer un expéditeur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyInput'
      responses:
        '201':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-origin: existing
      x-replaces:
      - POST /v2/senders
  /me/senders/{senderId}:
    get:
      operationId: getSender
      tags:
      - Expéditeurs
      summary: Un expéditeur
      parameters:
      - $ref: '#/components/parameters/senderId'
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-origin: existing
      x-replaces:
      - GET /v2/senders/{id}/{sender_id}/one
    put:
      operationId: updateSender
      tags:
      - Expéditeurs
      summary: Modifier un expéditeur
      description: 'Remplace les champs. `idDocumentNumber` est facultatif : s''il est absent, le numéro déjà enregistré est conservé.'
      parameters:
      - $ref: '#/components/parameters/senderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyInput'
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-origin: existing
      x-replaces:
      - POST /v2/senders/update/{id}
      - POST /v2/sender/update
    delete:
      operationId: archiveSender
      tags:
      - Expéditeurs
      summary: Archiver un expéditeur
      parameters:
      - $ref: '#/components/parameters/senderId'
      responses:
        '204':
          description: Aucun contenu.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-origin: new
  /me/beneficiaries:
    get:
      operationId: listBeneficiaries
      tags:
      - Bénéficiaires
      summary: Mes bénéficiaires
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-origin: existing
      x-replaces:
      - GET /v2/beneficiaries/{id}
      - GET /v2/all_beneficiaries/{id}
    post:
      operationId: createBeneficiary
      tags:
      - Bénéficiaires
      summary: Créer un bénéficiaire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyInput'
      responses:
        '201':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-origin: existing
      x-replaces:
      - POST /v2/beneficiaries
  /me/beneficiaries/{beneficiaryId}:
    get:
      operationId: getBeneficiary
      tags:
      - Bénéficiaires
      summary: Un bénéficiaire
      parameters:
      - $ref: '#/components/parameters/beneficiaryId'
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-origin: existing
      x-replaces:
      - GET /v2/beneficiaries/{id}/one
    put:
      operationId: updateBeneficiary
      tags:
      - Bénéficiaires
      summary: Modifier un bénéficiaire
      description: 'Remplace les champs. `idDocumentNumber` est facultatif : s''il est absent, le numéro déjà enregistré est conservé.'
      parameters:
      - $ref: '#/components/parameters/beneficiaryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyInput'
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-origin: existing
      x-replaces:
      - POST /v2/beneficiaries/update/{id}
    delete:
      operationId: archiveBeneficiary
      tags:
      - Bénéficiaires
      summary: Archiver un bénéficiaire
      parameters:
      - $ref: '#/components/parameters/beneficiaryId'
      responses:
        '204':
          description: Aucun contenu.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-origin: new
  /me/beneficiaries/{beneficiaryId}/destinations:
    get:
      operationId: listDestinations
      tags:
      - Bénéficiaires
      summary: Comptes et portefeuilles d'un bénéficiaire
      parameters:
      - $ref: '#/components/parameters/beneficiaryId'
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Destination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-origin: new
    post:
      operationId: createDestination
      tags:
      - Bénéficiaires
