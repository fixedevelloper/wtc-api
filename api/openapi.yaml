components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT RS256 de courte durée (10 à 15 minutes).
    serviceKey:
      type: apiKey
      in: header
      name: X-Service-Key
      description: Clé d'un service interne (chatbot WhatsApp).
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Numéro de page, à partir de 0.
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      schema:
        type: string
        examples:
        - createdAt,desc
      description: champ,asc|desc
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 100
      description: Clé choisie par le client (UUID conseillé). Un rejeu avec la même clé et le même corps renvoie le résultat initial ; un corps différent renvoie 422.
    CountryCode:
      name: countryCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CountryCode'
    senderId:
      name: senderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    beneficiaryId:
      name: beneficiaryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    destinationId:
      name: destinationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    transferId:
      name: transferId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    topUpId:
      name: topUpId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    customerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    documentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    adjustmentId:
      name: adjustmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    feeScheduleId:
      name: feeScheduleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    runId:
      name: runId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    itemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PartyRole:
      name: role
      in: query
      schema:
        type: string
        enum:
        - SENDER
        - BENEFICIARY
    CustomerFilter:
      name: customerId
      in: query
      schema:
        type: string
        format: uuid
      description: Limiter à un client.
    TransferStatusFilter:
      name: status
      in: query
      schema:
        type: string
        enum:
        - CREATED
        - PAYOUT_PENDING
        - PROCESSING
        - COMPLETED
        - FAILED
        - REFUNDED
        - CANCELLED
    TopUpStatusFilter:
      name: status
      in: query
      schema:
        type: string
        enum:
        - PENDING
        - PROCESSING
        - COMPLETED
        - FAILED
        - CANCELLED
        - REJECTED
    From:
      name: from
      in: query
      schema:
        type: string
        format: date
      description: Date de début (incluse).
    To:
      name: to
      in: query
      schema:
        type: string
        format: date
      description: Date de fin (incluse).
    EntityType:
      name: entityType
      in: query
      schema:
        type: string
    EntityId:
      name: entityId
      in: query
      schema:
        type: string
    Actor:
      name: actor
      in: query
      schema:
        type: string
        description: Courriel ou identifiant de l'auteur.
    PartyTypePair:
      name: partyTypePair
      in: query
      schema:
        type: string
        enum:
        - P2P
        - P2B
        - B2P
        - B2B
      description: 'Type de transfert (expéditeur → bénéficiaire : P = personne, B = entreprise). Sans valeur : libellés communs.'
    partyId:
      name: partyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    token:
      name: token
      in: path
      required: true
      schema:
        type: string
    key:
      name: key
      in: path
      required: true
      schema:
        type: string
    WalletCurrency:
      name: currency
      in: query
      required: false
      description: 'Devise du portefeuille (par défaut : celle du pays de résidence du client).'
      schema:
        $ref: '#/components/schemas/CurrencyCode'
  responses:
    BadRequest:
      description: Requête mal formée.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentification absente ou invalide.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Droit insuffisant.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Ressource introuvable (ou appartenant à un autre client).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflit d'état (par exemple transition de statut interdite).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Règle métier violée ou validation échouée (champ `errors`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Fichier trop volumineux.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Limite de débit atteinte (en-tête Retry-After).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: Le fournisseur de paiement est injoignable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Decimal:
      type: string
      pattern: ^-?\d{1,15}(\.\d{1,4})?$
      examples:
      - '1500.00'
      description: Décimal en chaîne (jamais un flottant).
    CurrencyCode:
      type: string
      pattern: ^[A-Z]{3}$
      examples:
      - XAF
      description: Code devise ISO 4217.
    CountryCode:
      type: string
      pattern: ^[A-Z]{2}$
      examples:
      - CG
      description: Code pays ISO 3166-1 alpha-2.
    PhoneNumber:
      type: string
      pattern: ^\+[1-9][0-9]{6,14}$
      examples:
      - '+242061234567'
      description: Numéro au format E.164.
    Money:
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/Decimal'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      required:
      - amount
      - currency
      additionalProperties: false
    PageMeta:
      type: object
      required:
      - page
      - size
      - totalElements
      - totalPages
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    Problem:
      type: object
      description: RFC 9457 (application/problem+json).
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri-reference
          examples:
          - https://api.wtc.example/problems/insufficient-funds
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Code applicatif stable (INSUFFICIENT_FUNDS, VALIDATION_FAILED…).
          examples:
          - INSUFFICIENT_FUNDS
          x-known-codes:
          - MALFORMED_REQUEST
          - UNAUTHENTICATED
          - ACCESS_DENIED
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - UNSUPPORTED_MEDIA_TYPE
          - CONFLICT
          - VALIDATION_FAILED
          - RATE_LIMITED
          - INTERNAL_ERROR
          - COUNTRY_NOT_FOUND
          - INVALID_CREDENTIALS
          - INVALID_MFA_CODE
          - MFA_CODE_REJECTED
          - INVALID_REFRESH_TOKEN
