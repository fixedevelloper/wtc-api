      description: 'Étend ReconciliationRun (champs recopiés : les compositions allOf avec additionalProperties:false se contredisent).'
      properties:
        id:
          type: integer
          format: int64
        businessDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - RUNNING
          - COMPLETED
          - FAILED
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        matched:
          type: integer
        mismatches:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationItem'
      required:
      - id
      - businessDate
      - status
      - startedAt
      additionalProperties: false
    CreateReconciliationRequest:
      type: object
      properties:
        businessDate:
          type: string
          format: date
      required:
      - businessDate
      additionalProperties: false
    ResolveItemRequest:
      type: object
      properties:
        note:
          type: string
          minLength: 5
      required:
      - note
      additionalProperties: false
    PlatformSetting:
      type: object
      properties:
        key:
          type: string
        value: {}
        updatedAt:
          type: string
          format: date-time
      required:
      - key
      - value
      additionalProperties: false
    SettingValue:
      type: object
      properties:
        value: {}
      required:
      - value
      additionalProperties: false
    SyncResult:
      type: object
      properties:
        banks:
          type: integer
        operators:
          type: integer
          description: Opérateurs mobiles créés d'après les services de Wace (ceux qui existaient déjà ne sont pas comptés).
        referenceValues:
          type: integer
        startedAt:
          type: string
          format: date-time
        payerCodes:
          type: integer
          description: Codes payeur importés (banque par pays, opérateur mobile).
        warnings:
          type: array
          items:
            type: string
          description: Anomalies à traiter à la main (opérateur sans service chez Wace, liste indisponible…).
      required:
      - startedAt
      additionalProperties: false
