# Reverse proxy nginx devant l'API WTC (conteneur publié sur 127.0.0.1:8080 par compose.prod.yaml).
# Fichier : /etc/nginx/sites-available/<domaine>.conf, lié dans sites-enabled/. Il est volontairement en HTTP seul :
# « certbot --nginx -d <domaine> » y ajoute lui-même le HTTPS et la redirection (docs/runbook.md, « Certificat TLS avec certbot »).
# Remplacer api.example.com par votre domaine : sed 's/api.example.com/<domaine>/g' wtc-api.conf
server {
    listen 80;
    listen [::]:80;
    server_name wtc.api.digitagateway.com;

    # Environnement de recette : interdire l'indexation par les moteurs de recherche.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Pièces d'identité et autres envois (l'API accepte 10 Mio par requête).
    client_max_body_size 10m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # IMPORTANT : ÉCRASER X-Forwarded-For avec l'adresse réellement vue par nginx. L'API prend la première adresse de cet en-tête
    # comme IP du client (journal de connexion, limiteur de débit, verrouillage) : avec $proxy_add_x_forwarded_for, un client
    # qui envoie « X-Forwarded-For: 9.9.9.9 » ferait enregistrer 9.9.9.9 et contournerait les limites par IP.
    # Si un CDN ou un autre proxy se trouve devant nginx, configurer plutôt set_real_ip_from / real_ip_header.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 180s;
    }

    # Supervision : les métriques restent internes (port 8081 non publié). Sur le port public, l'API répond de toute façon 401
    # à /actuator/* : ces blocs ne font que couper plus tôt.
    location /actuator/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
    }
}
